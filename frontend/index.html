<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="globals.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <body>
    <div class="main-window" ></div>
    <div class="search-box" id="results"></div>
    <script>
      async function loadMap() {
        const res = await fetch('assets/drawing3.svg');
        mapEl.innerHTML = await res.text();
        svg = mapEl.querySelector('svg');
        svg.removeAttribute('width');
        svg.removeAttribute('height');

        // @TODO get user's location and pan to it
        const pz = svgPanZoom(svg, {
          zoomScaleSensitivity: 0.3,
          minZoom: 0.5,
          maxZoom: 20,
          controlIconsEnabled: false,
          dblClickZoomEnabled: false
        });
        initClicks(svg);
      }
    </script>
  </body>
  <script src="map.js"></script>
</body>
</html>
