<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="globals.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>
  <body>
    <div class="main-window" >
      <div class = "search">
        <input type="text" placeholder="Search Bruin Maps..">
      </div>
      <div class="search-box" id="results"></div>
      <div class="route-container" id="routes"></div>
    </div>
    
    <script>
      async function addToRoute(name)
      {
        if (typeof(Storage) !== "undefined") 
        {
          // @TODO Check if route has been added twice in a row
          const list = JSON.parse(localStorage.getItem("route")) || [];
          list.push(name);
          localStorage.setItem("route", JSON.stringify(list));

          // @TODO Add route-index if route is included multiple times
          // i.e (ehs-1, edwards-1, ehs-2, location-1, ehs-3) so that we can remove specific indexes not all at once
          updateRouteContainer();
        }
        else
        {
          console.error("Browser doesn't support local storage!")
        }
      }

      async function removeFromRoute(name)
      {
        if (typeof(Storage) !== "undefined") 
        {
          const list = JSON.parse(localStorage.getItem("route")) || [];

          // This removes all instances of the route
          const updated = list.filter(item => item !== name);
          localStorage.setItem("route", JSON.stringify(updated));
          updateRouteContainer();
        }
        else
        {
          console.error("Browser doesn't support local storage!")
        }
      }

      async function loadMap() {
        const res = await fetch('assets/drawing3.svg');
        mapEl.innerHTML = await res.text();
        svg = mapEl.querySelector('svg');
        svg.removeAttribute('width');
        svg.removeAttribute('height');

        // @TODO get user's location and pan to it
        const pz = svgPanZoom(svg, {
          zoomScaleSensitivity: 0.3,
          minZoom: 0.5,
          maxZoom: 20,
          controlIconsEnabled: false,
          dblClickZoomEnabled: false
        });
        initClicks(svg);
      }
    </script>
  </body>
  <script src="map.js"></script>
</body>
</html>
